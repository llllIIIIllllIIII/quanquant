<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>QuanQuant Agent 設定精靈 — 步驟 3／3</title>
  <style>
    body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    dt { font-weight: 700; margin-top: 0.75rem; }
    .error { color: #b00020; background: #fdecea; border: 1px solid #f5c6cb; border-radius: 0.5rem; padding: 0.75rem 1rem; margin: 1rem 0; }
    .error strong { display: block; margin-bottom: 0.35rem; }
    .error a { color: #b00020; }
    .notice { color: #8a6100; background: #fff8e1; border-radius: 0.5rem; padding: 0.75rem 1rem; }
  </style>
</head>
<body>
  <h1>設定精靈 — 步驟 3／3：確認啟動</h1>

  {% if launch_error %}
    <div class="error">
      <strong>⚠️ 無法啟動</strong>
      {{ launch_error }}
      <p style="margin:0.5rem 0 0;">若 Agent 其實已在執行，可直接前往 <a href="/status">狀態頁</a> 查看。</p>
    </div>
  {% endif %}

  {% if shortcut_notice %}
    <p class="notice">{{ shortcut_notice }}</p>
  {% endif %}

  <dl>
    <dt>伺服器</dt><dd>{{ site_origin }}</dd>
    <dt>模式</dt><dd>{{ mode }}</dd>
    <dt>商品</dt><dd>{{ symbol }}</dd>
    <dt>帳號</dt><dd>{{ username }}</dd>
  </dl>

  <form method="post" action="/setup/step3/launch">
    <button type="submit">啟動</button>
  </form>
</body>
</html>
