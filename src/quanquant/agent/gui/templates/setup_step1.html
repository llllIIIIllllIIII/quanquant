<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>QuanQuant Agent 設定精靈 — 步驟 1／3</title>
  {% if not error %}
  <meta http-equiv="refresh" content="2;url=/setup/poll-status">
  {% endif %}
  <style>
    body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    .user-code { font-size: 2rem; letter-spacing: 0.15em; font-weight: 700; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>設定精靈 — 步驟 1／3：連線授權</h1>

  {% if error %}
    <p class="error">授權未完成（{{ error }}），請重新開始。</p>
    <form method="post" action="/setup/step1/start">
      <button type="submit">重新開始授權</button>
    </form>
  {% elif user_code %}
    <p>請在瀏覽器另開分頁（或使用手機）開啟核准頁，輸入以下代碼完成授權：</p>
    <p class="user-code">{{ user_code }}</p>
    <p><a href="{{ approval_url }}" target="_blank" rel="noopener noreferrer">開核准頁</a></p>
    <p>等待核准中……（本頁每 2 秒自動更新）</p>
  {% else %}
    <p>正在與伺服器建立連線……</p>
  {% endif %}
</body>
</html>
