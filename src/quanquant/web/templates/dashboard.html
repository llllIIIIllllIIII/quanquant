{% extends "base.html" %}
{% block content %}
<section class="quote-panel" hx-ext="sse" sse-connect="/quote/stream">
  <div id="quote" sse-swap="message" hx-swap="innerHTML"
       hx-get="/quote" hx-trigger="load">
    <div class="quote">等待報價…</div>
  </div>
</section>

<section x-data="chartPanel()">
  <div class="chart-head">
    <h3>{{ symbol }} 走勢圖 <small class="muted">· 本系統即時資料</small></h3>
    <div class="chart-head-actions">
      <select class="session-sel" x-model="session" @change="setSession(session)"
              aria-label="價格時段">
        <template x-for="s in sessions" :key="s.code">
          <option :value="s.code" x-text="s.label"></option>
        </template>
      </select>
      <button class="outline mini" @click="openSettings()">指標設定</button>
      <button class="outline mini" @click="openAlerts()">警示</button>
      <button type="button" id="pulse-toggle" class="outline mini pulse-toggle"
              aria-pressed="false" aria-label="市場脈搏音效"
              title="市場脈搏音效：關（點擊開啟）">♥</button>
      <button type="button" id="pulse-tg-toggle" class="outline mini pulse-tg-toggle"
              aria-pressed="false" aria-label="Telegram 通知"
              title="Telegram 通知：載入中…">🔔</button>
      <button type="button" class="outline mini color-scheme-toggle"
              @click="toggleColorScheme()"
              :title="colorScheme === 'red_up' ? 'K線配色：紅漲綠跌（點擊切換）' : 'K線配色：綠漲紅跌（點擊切換）'"
              x-text="colorScheme === 'red_up' ? '🔴漲' : '🟢漲'"></button>
      <button type="button" class="outline mini ded-toggle" :class="{active: deductionOn}"
              @click="toggleDeduction()" :aria-pressed="deductionOn" aria-label="均線扣抵"
              :title="deductionOn ? '均線扣抵：開（點擊關閉）' : '均線扣抵：關（點擊開啟）'">▽ 扣抵</button>
      <button type="button" class="outline mini draw-scope-toggle" @click="toggleDrawScope()"
              :aria-pressed="drawScope === 'all'" aria-label="畫線跨時框模式"
              :title="drawScope === 'hybrid'
                ? '畫線跨時框：智慧混合（水平線/價格線跨所有時框，位置鎖定；趨勢線/射線/通道等只在繪製的時框顯示）。點擊改為全部時框'
                : '畫線跨時框：全部時框顯示（所有畫線都出現在每個時框，趨勢線在較粗時框可能被壓縮）。點擊改回智慧混合'"
              x-text="drawScope === 'hybrid' ? '跨框:智慧' : '跨框:全部'"></button>
    </div>
  </div>

  <div class="ded-legend" x-show="deductionOn" x-cloak>
    <span class="muted ded-legend-label">即時扣抵</span>
    <template x-if="deductionLegend.length === 0">
      <small class="muted">請先在指標設定加入 MA</small>
    </template>
    <template x-for="(r, index) in deductionLegend" :key="r.period + '_' + index">
      <span class="ded-chip" :style="`color:${r.color}`" :title="dedTitle(r)">
        <span x-text="'MA' + r.period"></span>
        <span x-text="r.status === 'insufficient-data' ? '—' : Math.round(r.deductionValue).toLocaleString()"></span>
        <span class="ded-arrow" x-text="dedArrow(r.status)"></span>
      </span>
    </template>
  </div>

  <div class="tf-bar" role="group">
    <template x-for="t in tfs" :key="t.code">
      <button class="tf-btn" :class="{active: tf === t.code}"
              @click="setTf(t.code)" x-text="t.label"></button>
    </template>
  </div>

  <div class="chart-row">
    <div class="draw-rail" role="toolbar" aria-label="繪圖工具">
      <button class="rail-btn" @click="draw('segment')" title="趨勢線" aria-label="趨勢線">╱</button>
      <button class="rail-btn" @click="draw('rayLine')" title="射線" aria-label="射線">↗</button>
      <button class="rail-btn" @click="draw('horizontalStraightLine')" title="水平線" aria-label="水平線">━</button>
      <button class="rail-btn" @click="draw('verticalStraightLine')" title="垂直線" aria-label="垂直線">┃</button>
      <button class="rail-btn" @click="draw('priceChannelLine')" title="平行通道" aria-label="平行通道">∥</button>
      <button class="rail-btn" @click="draw('priceLine')" title="價格線" aria-label="價格線">⊢</button>
      <button class="rail-btn" @click="draw('fibonacciLine')" title="Fibonacci" aria-label="Fibonacci">≣</button>
      <button type="button" class="rail-btn draw-vis-toggle" :class="{off: !drawingsVisible}"
              @click="toggleDrawingsVisible()" :aria-pressed="!drawingsVisible"
              :aria-label="drawingsVisible ? '隱藏所有繪圖' : '顯示所有繪圖'"
              :title="drawingsVisible ? '所有繪圖：顯示中（點擊隱藏）' : '所有繪圖：已隱藏（點擊顯示）'">
        <svg x-show="drawingsVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg x-show="!drawingsVisible" x-cloak xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <button class="rail-btn danger" @click="clearDrawings()" title="清除全部" aria-label="清除全部">✕</button>
    </div>
    <div id="kchart">
      <div id="chart-empty" class="muted">資料累積中…（盤中每 5 秒記錄，累積約 1 分鐘出現第一根 K 棒）</div>
    </div>
  </div>
  <small class="muted">
    K 線為本系統自 TAIFEX 擷取之即時台指期資料；日 K 以上由 FinMind 歷史回補。
    分鐘 K 僅涵蓋系統開始記錄之後的期間。
  </small>

  <!-- 指標設定 dialog -->
  <dialog :open="settingsOpen">
    <article class="modal-card">
      <header>
        <button aria-label="Close" rel="prev" @click="settingsOpen = false"></button>
        <strong>指標設定</strong>
      </header>

      <template x-for="ind in indicatorDefs" :key="ind.key">
        <fieldset class="ind-block">
          <label>
            <input type="checkbox" x-model="form[ind.key].enabled">
            <strong x-text="ind.title"></strong> <small class="muted" x-text="ind.hint"></small>
          </label>
          <template x-for="(p, i) in form[ind.key].params" :key="i">
            <div class="param-row">
              <input type="number" min="1" step="1" x-model.number="p.period" placeholder="週期">
              <input type="color" x-model="p.color">
              <button type="button" class="outline mini danger"
                      @click="form[ind.key].params.splice(i, 1)">−</button>
            </div>
          </template>
          <button type="button" class="outline mini"
                  @click="form[ind.key].params.push({period: 10, color: '#f0b90b'})">＋ 加一條</button>
        </fieldset>
      </template>

      <fieldset class="ind-block">
        <label>
          <input type="checkbox" x-model="form.vol.enabled">
          <strong>成交量 VOL</strong>
        </label>
      </fieldset>

      <footer class="form-actions">
        <button type="button" class="secondary" @click="settingsOpen = false">取消</button>
        <button type="button" @click="saveSettings()">儲存</button>
      </footer>
    </article>
  </dialog>

  <!-- 警示 dialog -->
  <dialog :open="alertsOpen">
    <article class="modal-card alerts-card">
      <header>
        <button aria-label="Close" rel="prev" @click="alertsOpen = false"></button>
        <strong>價格 / 指標 警示</strong>
        <small class="muted">以該週期 K 棒收盤結算值為準</small>
      </header>

      <form @submit.prevent="submitAlert()">
        <div class="grid">
          <label>時間週期
            <select x-model="alertForm.timeframe">
              <template x-for="t in tfs" :key="t.code"><option :value="t.code" x-text="t.label"></option></template>
            </select>
          </label>
          <label>目標
            <select x-model="alertForm.leftTarget">
              <template x-for="o in indTargets" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label x-show="alertForm.leftTarget !== 'price'">週期
            <input type="number" min="1" step="1" x-model.number="alertForm.leftPeriod">
          </label>
        </div>
        <div class="grid">
          <label>條件
            <select x-model="alertForm.op">
              <template x-for="o in ops" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label>對象
            <select x-model="alertForm.rightTarget">
              <template x-for="o in rightTargets" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label x-show="alertForm.rightTarget === 'const'">數值
            <input type="number" step="any" x-model.number="alertForm.rightValue">
          </label>
          <label x-show="alertForm.rightTarget !== 'const'">週期
            <input type="number" min="1" step="1" x-model.number="alertForm.rightPeriod">
          </label>
        </div>
        <label><input type="checkbox" x-model="alertForm.fireOnce"> 觸發一次後自動停用</label>
        <footer class="form-actions">
          <button type="submit">＋ 新增警示</button>
        </footer>
      </form>

      <h6>已建立的警示</h6>
      <div class="alert-list">
        <template x-for="a in alerts" :key="a.id">
          <div class="alert-row" :class="{disabled: !a.enabled}">
            <span x-text="alertLabel(a)"></span>
            <span class="alert-actions">
              <button class="outline mini" @click="toggleAlert(a)" x-text="a.enabled ? '停用' : '啟用'"></button>
              <button class="outline mini danger" @click="deleteAlert(a.id)">刪除</button>
            </span>
          </div>
        </template>
        <p class="muted" x-show="!alerts.length">尚無警示</p>
      </div>

      <h6>近期觸發</h6>
      <div class="alert-events">
        <template x-for="e in alertEvents" :key="e.id">
          <div class="alert-event">
            <small class="muted" x-text="(e.firedAt||'').slice(0,19).replace('T',' ')"></small>
            <span x-text="e.message"></span>
          </div>
        </template>
        <p class="muted" x-show="!alertEvents.length">尚無觸發紀錄</p>
      </div>
    </article>
  </dialog>

  <!-- 警示即時通知 -->
  <div class="toast-stack">
    <template x-for="t in toasts" :key="t.id">
      <div class="alert-toast">🔔 <span x-text="t.body"></span></div>
    </template>
  </div>
</section>

<script src="https://unpkg.com/klinecharts@9.8.12/dist/umd/klinecharts.min.js"></script>
<script>window.QQ_SYMBOL = "{{ symbol }}"; window.QQ_COLOR_SCHEME = "{{ color_scheme }}";</script>
<script src="/static/ma_deduction.js"></script>
<script src="/static/chart.js"></script>
<script src="/static/pulse.js"></script>
{% endblock %}
