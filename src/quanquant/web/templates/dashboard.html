{% extends "base.html" %}
{% block content %}
<section class="quote-panel" hx-ext="sse" sse-connect="/quote/stream">
  <div id="quote" sse-swap="message" hx-swap="innerHTML"
       hx-get="/quote" hx-trigger="load">
    <div class="quote">等待報價…</div>
  </div>
</section>

<section x-data="chartPanel()">
  <div class="chart-toolbar" @click.outside="moreOpen = false">
    <div class="tb-left">
      <!-- 003：標題後綴隨時段選單變（該處時段是使用者可選的維度）——全（all）/日（day）/夜（night）。 -->
      <h3 class="chart-title"><span
            x-text="'{{ symbol | symbol_label }}近' + (session === 'day' ? '日' : session === 'night' ? '夜' : '全')"
          ></span><small class="muted">即時</small></h3>
      <select class="session-sel" x-model="session" @change="setSession(session)"
              aria-label="價格時段">
        <template x-for="s in sessions" :key="s.code">
          <option :value="s.code" x-text="s.label"></option>
        </template>
      </select>
    </div>
    <button type="button" class="tf-btn intraday-btn" :class="{active: intradayMode}"
            @click="toggleIntraday()" :aria-pressed="intradayMode"
            title="分時走勢：當日 area 走勢線＋VWAP 均價線（鎖 1分/日盤）">分時</button>
    <div class="tb-tfs" role="group" aria-label="時間週期">
      <template x-for="t in tfs" :key="t.code">
        <button class="tf-btn" :class="{active: tf === t.code}"
                @click="setTf(t.code)" x-text="t.label"></button>
      </template>
    </div>
    <div class="tb-right">
      <button type="button" class="tb-btn" x-show="!!toggleFullscreen" x-cloak
              @click="toggleFullscreen()" aria-label="全螢幕" title="全螢幕（Esc 退出）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" @click="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9l-2.1 2.1m-10 10-2.1 2.1"/>
        </svg>
        指標
      </button>
      <button type="button" class="tb-btn" @click="openAlerts()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        警示
      </button>
      <div class="more-wrap">
        <button type="button" class="tb-btn more-btn" @click="moreOpen = !moreOpen"
                :aria-expanded="moreOpen" aria-label="更多圖表功能" title="更多圖表功能">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
          </svg>
          <span class="more-dot" aria-hidden="true"></span>
        </button>
        <div class="more-menu" x-show="moreOpen" x-cloak>
          <button type="button" id="pulse-toggle" class="menu-row pulse-toggle"
                  aria-pressed="false" aria-label="市場脈搏音效"
                  title="市場脈搏音效：關（點擊開啟）">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
            <span>市場脈搏音效</span><span class="row-state"></span>
          </button>
          <button type="button" id="pulse-tg-toggle" class="menu-row pulse-tg-toggle"
                  aria-pressed="false" aria-label="Telegram 通知"
                  title="Telegram 通知：載入中…">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
            </svg>
            <span>Telegram 通知</span><span class="row-state"></span>
          </button>
          <button type="button" class="menu-row" @click="toggleColorScheme()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M8 6v12M8 9h-3v6h3M16 4v16M16 7h3v8h-3"/>
            </svg>
            <span>K 線配色</span>
            <span class="row-state" x-text="colorScheme === 'red_up' ? '紅漲' : '綠漲'"></span>
          </button>
          <button type="button" class="menu-row" :class="{active: deductionOn}"
                  @click="toggleDeduction()" :aria-pressed="deductionOn"
                  title="扣抵三角：在 K 線圖標出各 MA 的扣抵位置（開/關）">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
            <span>扣抵三角</span>
            <span class="row-state" x-text="deductionOn ? '開' : '關'"></span>
          </button>
          <button type="button" class="menu-row" :class="{active: nakedK}"
                  @click="toggleNakedK()" :aria-pressed="nakedK"
                  title="裸K：只顯示 K 線，隱藏所有指標與扣抵三角（開/關）">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 3v18M6 7h5v5H6M14 12v9M14 12h4v6h-4"/>
            </svg>
            <span>裸K</span>
            <span class="row-state" x-text="nakedK ? '開' : '關'"></span>
          </button>
          <button type="button" class="menu-row" @click="toggleDrawScope()"
                  :aria-pressed="drawScope === 'all'"
                  :title="drawScope === 'hybrid'
                    ? '畫線跨時框：單一模式（水平線/價格線跨所有時框；趨勢線只在繪製時框顯示）。點擊改為全部時框'
                    : '畫線跨時框：全部時框顯示。點擊改回單一模式'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M2 12h20M12 2v20"/>
            </svg>
            <span>畫線跨時框</span>
            <span class="row-state" x-text="drawScope === 'hybrid' ? '單一' : '全部'"></span>
          </button>
          <button type="button" class="menu-row" @click="resetLayout()"
                  title="重置排版：把副圖高度、K 棒寬度與橫向縮放回復預設（副圖被拖亂、圖表跑版時用）">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
            <span>重置排版</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-row">
    <div class="draw-rail" role="toolbar" aria-label="繪圖工具">
      <button class="rail-btn" @click="draw('segment')" title="趨勢線" aria-label="趨勢線">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="1.5" fill="currentColor"/><circle cx="20" cy="4" r="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('rayLine')" title="射線" aria-label="射線">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="20" x2="17" y2="7"/><path d="M14 4h6v6"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('horizontalStraightLine')" title="水平線" aria-label="水平線">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('verticalStraightLine')" title="垂直線" aria-label="垂直線">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="3" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('priceChannelLine')" title="平行通道" aria-label="平行通道">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="16" x2="21" y2="8"/><line x1="3" y1="21" x2="21" y2="13"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('priceLine')" title="價格線" aria-label="價格線">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="12" x2="15" y2="12"/><path d="M18 9v6M16.5 10.5h3"/>
        </svg>
      </button>
      <button class="rail-btn" @click="draw('fibonacciLine')" title="Fibonacci" aria-label="Fibonacci">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <button type="button" class="rail-btn draw-vis-toggle" :class="{off: !drawingsVisible}"
              @click="toggleDrawingsVisible()" :aria-pressed="!drawingsVisible"
              :aria-label="drawingsVisible ? '隱藏所有繪圖' : '顯示所有繪圖'"
              :title="drawingsVisible ? '所有繪圖：顯示中（點擊隱藏）' : '所有繪圖：已隱藏（點擊顯示）'">
        <svg x-show="drawingsVisible" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg x-show="!drawingsVisible" x-cloak xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <button class="rail-btn danger" @click="clearDrawings()" title="清除全部" aria-label="清除全部">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
        </svg>
      </button>
    </div>
    <div id="kchart">
      <div id="chart-empty" class="muted">資料累積中…（盤中每 5 秒記錄，累積約 1 分鐘出現第一根 K 棒）</div>
    </div>
  </div>
  <small class="muted">
    K 線為本系統自 TAIFEX 擷取之即時台指期資料；日 K 以上由 FinMind 歷史回補。
    分鐘 K 僅涵蓋系統開始記錄之後的期間。
  </small>

  <!-- 指標設定 dialog（主從式：左清單/目錄，右參數） -->
  <dialog :open="settingsOpen">
    <article class="modal-card ind-settings">
      <header>
        <button aria-label="Close" rel="prev" @click="settingsOpen = false"></button>
        <strong>指標設定</strong>
      </header>

      <div class="ind-split">
        <!-- 左欄：已啟用清單 + 新增指標目錄 -->
        <aside class="ind-list">
          <template x-for="e in indicators.filter((x) => form[x.key] && form[x.key].enabled)" :key="e.key">
            <div class="ind-item" :class="{active: activeIndicator === e.key, 'ind-hidden': form[e.key].visible === false}"
                 @click="activeIndicator = e.key; catalogOpen = false">
              <span x-text="e.title"></span>
              <span class="ind-item-actions">
                <button type="button" class="outline mini ind-eye"
                        @click.stop="form[e.key].visible = (form[e.key].visible === false)"
                        :aria-pressed="form[e.key].visible !== false"
                        :aria-label="(form[e.key].visible !== false) ? '隱藏此指標' : '顯示此指標'"
                        :title="(form[e.key].visible !== false) ? '顯示中（點擊隱藏）' : '已隱藏（點擊顯示）'">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                    <line x1="3" y1="3" x2="21" y2="21" x-show="form[e.key].visible === false"/>
                  </svg>
                </button>
                <button type="button" class="outline mini danger"
                        @click.stop="form[e.key].enabled = false; if (activeIndicator === e.key) activeIndicator = null">−</button>
              </span>
            </div>
          </template>

          <hr>
          <button type="button" class="outline mini" @click="catalogOpen = !catalogOpen">＋ 新增指標</button>
          <div class="ind-catalog" x-show="catalogOpen" x-cloak>
            <template x-for="e in indicators.filter((x) => !(form[x.key] && form[x.key].enabled))" :key="e.key">
              <button type="button" class="outline mini catalog-item"
                      @click="form[e.key].enabled = true; activeIndicator = e.key; catalogOpen = false"
                      x-text="e.title"></button>
            </template>
            <p class="muted" x-show="indicators.every((x) => form[x.key] && form[x.key].enabled)">全部指標已啟用</p>
          </div>
        </aside>

        <!-- 右欄：選取指標的參數（由 paramSchema 生成） -->
        <section class="ind-detail" x-show="activeIndicator" x-cloak>
          <template x-for="e in indicators.filter((x) => x.key === activeIndicator)" :key="e.key">
            <div>
              <!-- 011（2026-09-10，需求 A）：指標名與「＋ 新增」收進欄頂固定列（sticky），
                   參數列在下方自己捲——加線的入口不再隨參數變多被推到卷軸底下。 -->
              <div class="ind-detail-head">
                <div><strong x-text="e.title"></strong> <small class="muted" x-text="e.hint"></small></div>
                <template x-if="e.repeatable">
                  <button type="button" class="outline mini"
                          @click="addIndicatorLine(e.key, $el)">＋ 新增</button>
                </template>
              </div>

              <!-- repeatable：多條線 -->
              <template x-if="e.repeatable">
                <div>
                  <template x-for="(p, i) in form[e.key].params" :key="i">
                    <div class="param-row">
                      <input type="number" min="1" step="1" x-model.number="p.period" placeholder="週期">
                      <input type="color" x-model="p.color">
                      <button type="button" class="outline mini danger"
                              @click="form[e.key].params.splice(i, 1)">−</button>
                    </div>
                  </template>
                </div>
              </template>

              <!-- fixed：單一物件，依 paramSchema 鋪 number 欄位 -->
              <template x-if="!e.repeatable && e.paramSchema.length">
                <div class="param-fixed">
                  <template x-for="f in e.paramSchema" :key="f.field">
                    <label>
                      <span x-text="f.label"></span>
                      <input type="number" :min="f.min" :step="f.step" x-model.number="form[e.key].params[f.field]">
                    </label>
                  </template>
                </div>
              </template>

              <!-- 固定線型指標（MACD/BOLL/KDJ）：每條子線顏色 + 恢復預設 -->
              <template x-if="e.lines && e.lines.length">
                <div class="ind-colors">
                  <template x-for="(ln, i) in e.lines" :key="ln.key">
                    <label class="ind-color-row">
                      <span x-text="ln.label"></span>
                      <input type="color" x-model="form[e.key].colors[i]">
                    </label>
                  </template>
                  <button type="button" class="outline mini"
                          @click="form[e.key].colors = window.QQIndicators.defaultColors(e)">恢復預設色</button>
                </div>
              </template>

              <!-- 無參數指標（VOL） -->
              <template x-if="!e.repeatable && !e.paramSchema.length">
                <p class="muted">此指標無可調參數。</p>
              </template>
            </div>
          </template>
        </section>
      </div>

      <footer class="form-actions">
        <button type="button" class="secondary" @click="settingsOpen = false">取消</button>
        <button type="button" @click="saveSettings()">儲存</button>
      </footer>
    </article>
  </dialog>

  <!-- 警示 dialog -->
  <dialog :open="alertsOpen">
    <article class="modal-card alerts-card">
      <header>
        <button aria-label="Close" rel="prev" @click="alertsOpen = false"></button>
        <strong>價格 / 指標 警示</strong>
        <small class="muted">以該週期 K 棒收盤結算值為準</small>
      </header>

      <form @submit.prevent="submitAlert()">
        <div class="grid">
          <label>時間週期
            <select x-model="alertForm.timeframe">
              <template x-for="t in tfs" :key="t.code"><option :value="t.code" x-text="t.label"></option></template>
            </select>
          </label>
          <label>目標
            <select x-model="alertForm.leftTarget">
              <template x-for="o in indTargets" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label x-show="alertForm.leftTarget !== 'price'">週期
            <input type="number" min="1" step="1" x-model.number="alertForm.leftPeriod">
          </label>
        </div>
        <div class="grid">
          <label>條件
            <select x-model="alertForm.op">
              <template x-for="o in ops" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label>對象
            <select x-model="alertForm.rightTarget">
              <template x-for="o in rightTargets" :key="o.code"><option :value="o.code" x-text="o.label"></option></template>
            </select>
          </label>
          <label x-show="alertForm.rightTarget === 'const'">數值
            <input type="number" step="any" x-model.number="alertForm.rightValue">
          </label>
          <label x-show="alertForm.rightTarget !== 'const'">週期
            <input type="number" min="1" step="1" x-model.number="alertForm.rightPeriod">
          </label>
        </div>
        <label><input type="checkbox" x-model="alertForm.fireOnce"> 觸發一次後自動停用</label>
        <footer class="form-actions">
          <button type="submit">＋ 新增警示</button>
        </footer>
      </form>

      <h6>已建立的警示</h6>
      <div class="alert-list">
        <template x-for="a in alerts" :key="a.id">
          <div class="alert-row" :class="{disabled: !a.enabled}">
            <span x-text="alertLabel(a)"></span>
            <span class="alert-actions">
              <button class="outline mini" @click="toggleAlert(a)" x-text="a.enabled ? '停用' : '啟用'"></button>
              <button class="outline mini danger" @click="deleteAlert(a.id)">刪除</button>
            </span>
          </div>
        </template>
        <p class="muted" x-show="!alerts.length">尚無警示</p>
      </div>

      <h6>近期觸發</h6>
      <div class="alert-events">
        <template x-for="e in alertEvents" :key="e.id">
          <div class="alert-event">
            <small class="muted" x-text="(e.firedAt||'').slice(0,19).replace('T',' ')"></small>
            <span x-text="e.message"></span>
          </div>
        </template>
        <p class="muted" x-show="!alertEvents.length">尚無觸發紀錄</p>
      </div>
    </article>
  </dialog>

  <!-- 警示即時通知 -->
  <div class="toast-stack">
    <template x-for="t in toasts" :key="t.id">
