{% extends "base.html" %}
{% block content %}
<div x-data="{ open: false }" @closeordermodal.window="open = false">

  <div class="journal-head">
    <h3>下單</h3>
  </div>

  {% if not service_available %}
  <p class="error-banner">下單子系統目前未啟用，無法送出新委託（歷史委託仍可查看）。</p>
  {% endif %}

  <div class="form-error-slot"></div>

  <!-- hx-disabled-elt：送出期間停用送出鈕，杜絕「回應還沒回來前的 double-submit」——連點的
       第二下會帶同一顆 client_order_id（成功回應才會 OOB 換鍵），撞 repository 冪等短路而靜默
       回既有委託、不建新單，使用者感覺「沒反應」。 -->
  <form hx-post="/orders" hx-swap="none" hx-disabled-elt="find button[type='submit']"
        x-data="{ priceType: 'LMT', orderType: 'ROD', priceValue: '' }">
    <input type="hidden" id="client-order-id-input" name="client_order_id" value="{{ client_order_id }}">
    <div class="grid">
      <label>商品
        <select name="symbol">{% for s in symbols %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select>
      </label>
      <label>方向
        <select name="action"><option value="Buy">買</option><option value="Sell">賣</option></select>
      </label>
      <label>口數
        <input name="qty" type="number" min="1" value="1">
      </label>
    </div>
    <div class="grid">
      <label>價格
        <!-- bug 1（simtrade 實測回歸）：MKT 時改用 readonly（而非 disabled）——disabled
             欄位完全依賴瀏覽器/HTMX 排除送出的行為，這件事本身無法用 TestClient 驗證
             （見 docs/superpowers/reviews/2026-07-25 驗收殘留：真瀏覽器 UI/HTMX 未經真
             瀏覽器互動）；readonly 一律隨表單送出，切到 MKT 時同時把顯示/送出值自動歸零
             （見下方 price_type 的 x-on:change），讓後端一律收得到明確的 price=0，不需要
             再依賴「有沒有送出這個欄位」。空值/None 後端 _parse_order_price 仍有防線
             （見 web/routers/orders.py），這裡是前端層再多一道保險。 -->
        <input name="price" type="text" placeholder="18000" x-model="priceValue" x-bind:readonly="priceType === 'MKT'">
      </label>
      <label>價格類型
        <select name="price_type" x-model="priceType"
                x-on:change="if (priceType === 'MKT') { priceValue = '0'; if (orderType === 'ROD') orderType = 'IOC'; }">
          <option value="LMT">限價</option><option value="MKT">市價</option>
        </select>
      </label>
      <label>委託類型
        <!-- TAIFEX 市價單不接受 ROD——MKT 時只能選 IOC/FOK，LMT 才可以 ROD。 -->
        <select name="order_type" x-model="orderType">
          <option value="ROD" x-bind:disabled="priceType === 'MKT'">ROD</option>
          <option value="IOC">IOC</option>
          <option value="FOK">FOK</option>
        </select>
      </label>
      <label>倉別
        <select name="octype"><option value="New">新倉</option><option value="Cover">平倉</option><option value="Auto">自動</option></select>
      </label>
    </div>
    <footer class="form-actions">
      <button type="submit" {% if not service_available %}disabled{% endif %}>送出</button>
    </footer>
  </form>

  <div class="confirm-slot"></div>

  <div class="mode-tabs" role="tablist">
    <a role="button" class="{{ '' if mode == 'real' else 'contrast' }}" href="/orders?mode=real">正式</a>
    <a role="button" class="{{ 'contrast' if mode == 'sim' else '' }}" href="/orders?mode=sim">模擬</a>
  </div>

  <!-- every 2s 週期輪詢：市價單成交是事後非同步落地（callback→RawInbox→RawInboxWorker 每 ~1s
       輪詢才更新委託為 filled、建部位），place() 回 200 當下那次 refreshorders 打完時成交多半還
       沒落地。沒有輪詢的話畫面會一直停在 submitted／空部位，直到下一次手動觸發。輪詢讓成交落地
       後 ~2s 內自動反映（部位 div 唯讀無互動；委託列表的取消/改單按鈕重繪不影響已開的改單 modal）。 -->
  <h4>委託</h4>
  <div hx-get="/orders/list?mode={{ mode }}" hx-trigger="load, refreshorders from:body, every 2s" hx-swap="innerHTML"></div>

  <h4>部位</h4>
  <div hx-get="/orders/positions" hx-trigger="load, refreshorders from:body, every 2s" hx-swap="innerHTML"></div>

  <!-- 改單 modal -->
  <dialog :open="open">
    <article class="modal-card">
      <header>
        <button aria-label="Close" rel="prev" @click="open = false"></button>
        <strong>改單</strong>
      </header>
      <div id="order-edit-modal"></div>
    </article>
  </dialog>

</div>
{% endblock %}
