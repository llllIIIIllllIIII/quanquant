[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanquant"
version = "0.1.0"
description = "Real-time Taiwan futures price tracker"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1",
    "fastapi>=0.136.3",
    "httpx>=0.27.0",
    "itsdangerous>=2.2",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.32",
    "shioaji>=1.5.3",  # 永豐 streaming live source (abi3 wheels: mac arm64 + linux x86_64)
    "sqlmodel>=0.0.38",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.49.0",
    "websockets>=14",  # agent WS 傳輸層顯式宣告；ws_client.py 用 additional_headers=（14+ 才有，<14 是 extra_headers）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
quanquant = "quanquant.cli:main"
quanquant-web = "quanquant.web.app:run"
quanquant-backfill = "quanquant.backfill_cli:main"
quanquant-pulse-verify = "quanquant.pulse.verify:main"
quanquant-user = "quanquant.user_cli:main"
quanquant-agent = "quanquant.agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quanquant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
