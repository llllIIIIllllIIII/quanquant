[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanquant"
version = "0.1.0"
description = "Real-time Taiwan futures price tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.38",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
quanquant = "quanquant.cli:main"
quanquant-web = "quanquant.web.app:run"
quanquant-backfill = "quanquant.backfill_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quanquant"]
force-include = { "src/quanquant/web/templates" = "quanquant/web/templates", "src/quanquant/web/static" = "quanquant/web/static" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
